# ============================================================================
# M5（TimesFM-3）气象协变量组合实验 —— 唯一配置入口
#
# 流程（cwd = 仓库根）：
#   1. features.py        DS 轨迹表 -> 特征库（按 features 段构建全部候选，线上同款格点/跨源聚合）
#   2. run_experiments.py 跑 experiments 段里的显式组合（C0 无协变量、C1 线上 general_GHI+general_TEMP ...）
#   3. rank_lgbm.py       LightGBM 粗排：对 C0 残差做置换重要性 + TreeSHAP，输出候选排序
#   4. search_m5.py       M5 精排：按粗排顺序逐个尝试"并排加入"或"与已选同类特征融合"，按保留规则贪心
#
# 字段约束（fields.py 强制检查）：
#   - 只能用 DS 表的 128 列；历史列 X 与 X_predict 必须成对使用；GHI_real 只有历史段 -> 只能当 past-only；
#   - observe_power_future 是标签，不进任何特征。
# 命名约定：特征 <name> 是历史 672 点，<name>_predict 是未来 pred_len 点；实验里只写 <name>。
# ============================================================================

run:
  name: nwp_cov_v2
  out_dir: runs/m5/nwp_cov/${run.name}/{predict_type}
  backend: m5                        # m5 | mock（mock 只用于本机无权重时跑通流程）
  device: auto
  batch_size: 512
  log_every_batches: 8               # 推理每 8 个 batch（=4096 行）打一行进度
  sys_path: []                       # 找不到 forecast_backbones/pipelines 时，填"直接包含这些目录的那一层"，如 [/home/xxx/NextGenPVForecast]

data:
  # 线上 multi_infer 落盘的 DS 表；{predict_type} 会被替换
  ds_glob: "/home/nfdw/nuoya/data/train/ds_trajectory_input/area=province_guangxi_solar/predict_type={predict_type}/date=*/*.parquet"
  predict_type: short                # short | ultra_short
  context_len: 672
  pred_len: 192                      # short 的未来段 480 点，截前 192；D+1 只用第 55..150 步
  time_range: null                   # 或 { start: "2026-08-25 00:00:00", end: "2026-09-15 23:45:00" }
  stations: all                      # 或 ["plant_xxx", ...]
  drop_province_row: true
  area: province_guangxi_solar
  cap_col: cap_power_on              # 线上 cap_power_on_val = cap_power_on[-1]
  cap_default: 1.0
  station_meta: forecast_backbones/m6/station_meta.csv   # station, lat, lon；没匹配上的站用 default_latlon
  default_latlon: [23.8, 108.8]      # 广西中部；设为 null 则退化为时钟几何（06:15-20:00 常数）
  tz_offset_h: 8
  feature_store: experiments/nwp_covariate/feature_store/{predict_type}
  repair_tail:                       # 线上 fix_observe_power_tail_miss：observe_power 尾部缺失用 M5 单变量补
    enabled: false
    fix_len: 600

m5:                                  # 与线上 M5 推理配置同构（transformer_models.DEFAULT_CFG 的键）
  checkpoint: /data/tangqingang/timesfm-3.0-pytorch
  device: auto
  per_core_batch_size: 32
  return_quantiles: true
  nan_policy: interp
  make_positive: true
  use_znorm: false
  use_symmetric_averaging: true

postprocess:                         # 线上 multi_infer：负值置 0 + 20:00~06:00（含两端）置 0
  clip_negative: true
  night_zero: ["20:00", "06:00"]

# ----------------------------------------------------------------------------
# 特征目录。每个特征：op + 参数 + 元信息
#   quantity: ghi | temp | power | wind | other   —— 粗排分组、精排时判断"同类可融合"
#   source:   EC | GDFS | SS | SG | obs | fused | derived
#   fusible:  true 表示精排时可与同 quantity 的已选特征合成一列
#   candidate: false 表示只作中间量/参考，不进粗排候选
# 可用 op：raw / grid / combine / clear_sky / kt / p_phys / threshold / scale / diff / trig（见 ops.py）
# ----------------------------------------------------------------------------
features:
  # ---- 第 1 层：单源单列（格点源 9 点中位数、min_valid=2，与线上 RULES 第一层一致）
  ghi_ec:    { op: grid, source: EC,   var: ghi,  method: median, min_valid: 2, quantity: ghi,  fusible: true }
  ghi_gdfs:  { op: grid, source: GDFS, var: ghi,  method: median, min_valid: 2, quantity: ghi,  fusible: true }
  ghi_ss:    { op: grid, source: SS,   var: ghi,  method: median, min_valid: 2, quantity: ghi,  fusible: true }
  ghi_sg:    { op: raw,  col: GHI_SOLARGIS,                                  quantity: ghi,  source: SG, fusible: true }
  temp_ec:   { op: grid, source: EC,   var: temp, method: median, min_valid: 2, quantity: temp, fusible: true }
  temp_gdfs: { op: grid, source: GDFS, var: temp, method: median, min_valid: 2, quantity: temp, fusible: true }
  temp_ss:   { op: grid, source: SS,   var: temp, method: median, min_valid: 2, quantity: temp, fusible: true }
  temp_sg:   { op: raw,  col: TEMP_SOLARGIS,                                 quantity: temp, source: SG, fusible: true }
  ws_sg:     { op: raw,  col: WS_SOLARGIS,   quantity: wind,  source: SG }
  wd_sin_sg: { op: trig, x: wd_sg, fn: sin,  quantity: wind,  source: SG }
  wd_cos_sg: { op: trig, x: wd_sg, fn: cos,  quantity: wind,  source: SG }
  wd_sg:     { op: raw,  col: WD_SOLARGIS,   quantity: wind,  source: SG, candidate: false }
  prec_sg:   { op: raw,  col: PREC_SOLARGIS, quantity: other, source: SG }
  pwat_sg:   { op: raw,  col: PWAT_SOLARGIS, quantity: other, source: SG }
  sdwe_sg:   { op: raw,  col: SDWE_SOLARGIS, quantity: other, source: SG }
  ghi_real:  { op: raw,  col: GHI_real, history_only: true, quantity: ghi, source: obs }

  # ---- 第 1 层变体：格点内取法（中心点 / 均值 / 格点离散度 = 云边缘信号）
  ghi_ec_p13:    { op: grid, source: EC,   var: ghi, method: point, point: 13, quantity: ghi, fusible: true }
  ghi_gdfs_p13:  { op: grid, source: GDFS, var: ghi, method: point, point: 13, quantity: ghi, fusible: true }
  ghi_ec_gstd:   { op: grid, source: EC,   var: ghi, method: std, min_valid: 2, quantity: other }
  ghi_gdfs_gstd: { op: grid, source: GDFS, var: ghi, method: std, min_valid: 2, quantity: other }

  # ---- 第 2 层：跨源融合。general_* 与线上 RULES 完全一致（GDFS、EC、SOLARGIS 中位数，min_valid=2）
  general_ghi:  { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg],   method: median, min_valid: 2, quantity: ghi,  source: fused }
  general_temp: { op: combine, members: [temp_gdfs, temp_ec, temp_sg], method: median, min_valid: 2, quantity: temp, source: fused }
  ghi_mean4:    { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: mean,      min_valid: 2, quantity: ghi, source: fused }
  ghi_med4:     { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: median,    min_valid: 2, quantity: ghi, source: fused }
  ghi_trim4:    { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: trim_mean, min_valid: 2, quantity: ghi, source: fused }
  ghi_inverr:   { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: inv_error, reference: ghi_real,
                  err_power: 1.0, min_clear: 50, window_steps: 672, quantity: ghi, source: fused }
  ghi_inverr_p: { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: inv_error, reference: power,
                  err_power: 1.0, min_clear: 50, window_steps: 672, quantity: ghi, source: fused }
  ghi_bias:     { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: bias_mean, reference: ghi_real,
                  min_clear: 50, window_steps: 672, bias_clip: [0.5, 2.0], quantity: ghi, source: fused }
  ghi_max4:     { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: max, min_valid: 2, quantity: other, source: fused }
  ghi_min4:     { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: min, min_valid: 2, quantity: other, source: fused }
  ghi_spread4:  { op: combine, members: [ghi_gdfs, ghi_ec, ghi_sg, ghi_ss], method: std, min_valid: 2, quantity: other, source: fused }
  temp_mean4:   { op: combine, members: [temp_gdfs, temp_ec, temp_sg, temp_ss], method: mean, min_valid: 2, quantity: temp, source: fused }

  # ---- 第 3 层：物理衍生
  ghi_clear:    { op: clear_sky, quantity: ghi, source: derived }
  kt_ec:        { op: kt, ghi: ghi_ec,   quantity: other, source: EC, candidate: false }
  kt_gdfs:      { op: kt, ghi: ghi_gdfs, quantity: other, source: GDFS, candidate: false }
  kt_sg:        { op: kt, ghi: ghi_sg,   quantity: other, source: SG, candidate: false }
  kt_ss:        { op: kt, ghi: ghi_ss,   quantity: other, source: SS, candidate: false }
  kt_cons:      { op: combine, members: [kt_gdfs, kt_ec, kt_sg, kt_ss], method: median, min_valid: 2, quantity: other, source: fused }
  kt_general:   { op: kt, ghi: general_ghi, quantity: other, source: derived }
  p_phys:       { op: p_phys, ghi: general_ghi, temp: general_temp, wind: ws_sg, quantity: power, source: derived }
  p_phys_mean4: { op: p_phys, ghi: ghi_mean4,   temp: temp_mean4,   wind: ws_sg, quantity: power, source: derived }

# ----------------------------------------------------------------------------
# 显式实验。covariates 里写特征名；history_only 的特征自动进 past_only_cols。
# extends: 继承另一个实验的 covariates 再追加。baseline: 配对比较的对象（默认 evaluation.baseline）。
# ----------------------------------------------------------------------------
experiments:
  C0:          { covariates: [], baseline: null, note: "纯功率零样本（不做配对比较）" }
  C1_online:   { covariates: [general_ghi, general_temp], baseline: C0, note: "线上现状" }
  C2_ghi:      { covariates: [general_ghi], baseline: C0 }
  S_ec:        { covariates: [ghi_ec, temp_ec] }
  S_gdfs:      { covariates: [ghi_gdfs, temp_gdfs] }
  S_sg:        { covariates: [ghi_sg, temp_sg] }
  S_ss:        { covariates: [ghi_ss, temp_ss] }
  A_side3:     { covariates: [ghi_gdfs, ghi_ec, ghi_sg, general_temp], note: "三源并排，让 M5 自己学权重" }
  A_mean4:     { covariates: [ghi_mean4, general_temp] }
  A_med4:      { covariates: [ghi_med4, general_temp] }
  A_trim4:     { covariates: [ghi_trim4, general_temp] }
  A_inverr:    { covariates: [ghi_inverr, general_temp] }
  A_inverr_p:  { covariates: [ghi_inverr_p, general_temp] }
  A_bias:      { covariates: [ghi_bias, general_temp] }
  A_ec_p13:    { covariates: [ghi_ec_p13, general_temp] }
  D_envelope:  { extends: C1_online, covariates: [ghi_max4, ghi_min4] }
  D_spread:    { extends: C1_online, covariates: [ghi_spread4] }
  D_gstd:      { extends: C1_online, covariates: [ghi_ec_gstd] }
  D_kt:        { covariates: [kt_cons, general_temp] }
  D_clear:     { extends: C1_online, covariates: [ghi_clear] }
  D_phys:      { covariates: [p_phys] }
  D_phys_ghi:  { covariates: [p_phys, general_ghi] }
  D_obs:       { extends: C1_online, covariates: [ghi_real], note: "GHI_real 只作 past-only" }

evaluation:
  baseline: C1_online                # 未写 baseline 的实验都和它比
  primary_by_type: { ultra_short: nanwang_ultra_short, short: nanwang_short_D+1 }
  keep_rule:                         # 保留规则（显式实验报告 + 精排贪心都用）
    min_mean_gain: 0.3               # 平均提升（百分点）
    ci: 0.95                         # 按天分块 bootstrap 置信区间，下界需 > 0
    bootstrap: 2000
    min_station_win_frac: 0.65       # 不变差的站占比
  weather_edges: [0.35, 0.75]        # 结果按实测晴空指数分 阴/多云/晴 拆解（只诊断，不进模型）

# ----------------------------------------------------------------------------
# LightGBM 粗排
# ----------------------------------------------------------------------------
rank:
  target: residual                   # residual = (标签 − C0 预测)/cap；level = 标签/cap（没有 C0 预测时自动退化）
  baseline_exp: C0
  leads: { ultra_short: [0, 15], short: [55, 150] }   # 闭区间，0 起
  issue_time: { short: "10:00", ultra_short: null }   # short 每站每天取 ≤10:00 的最后一行，与 D+1 指标同口径
  min_clear: 50                      # 只用白天样本
  max_rows: 400000                   # 样本上限（随机抽，种子固定）
  train_frac: 0.7                    # 按日期切：前 70% 天训练，后 30% 天验证
  candidates: auto                   # auto = features 里 candidate != false 的全部；或显式列表
  context_features: [lead, clear_target, last_ratio, yday_ratio]   # 只作背景，不参与排序
  n_repeats: 5
  noise_columns: 2                   # 高斯噪声参照列，重要性不高于它的视为无用
  corr_threshold: 0.95               # |Spearman| 超过它的候选归为一簇，额外做簇级置换
  lgbm:
    objective: regression
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 200
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    num_boost_round: 600
    early_stopping_rounds: 50
    verbose: -1
    seed: 0

# ----------------------------------------------------------------------------
# M5 精排（贪心）
# ----------------------------------------------------------------------------
search:
  start: C0                          # 起点组合（实验名）；也可写 C1_online 在线上组合上继续加
  order_from: rank                   # rank = 读 rank_lgbm 的输出；list = 用下面的 order
  order: [general_ghi, ghi_ec, ghi_gdfs, ghi_sg, ghi_ss, general_temp, p_phys, kt_cons, ghi_spread4]
  top_k: 12                          # 只尝试排序前 k 个
  drop_below_noise: true
  fusion_methods: [median, mean, trim_mean, inv_error]   # 候选与已选同 quantity 特征尝试合成一列的方式
  fusion_with: first                 # first = 只与该物理量第一个已选特征融合（每候选 ≤ 1+4 次推理）；all = 与每个都试
  fusion_reference: ghi_real         # inv_error / bias_mean 的参考真值（power = 用功率折算）
  max_selected: 10
  max_consecutive_fail: 2
